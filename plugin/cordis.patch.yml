# Installing this bundle sets up the same things as the install script (see index.js):
# runtime, skill, delegation notes, the dsh launcher and the MCP entries of Claude
# Desktop / Claude Code / Codex, plus the local service behind the panel. DSH already
# has native subagents, so no MCP client is mounted inside DSH itself.
- insert:
    - id: dsh-delegate-bootstrap
      name: dsh-delegate
      config:
        wireClients: true    # write the Claude Desktop / Claude Code / Codex entries
        startService: true   # start the local service (panel, dashboard) with DSH
        autostart: false     # login start + watchdog, like install --autostart
        usageHooks: false    # quota reminders in Claude Code, like install --usage-hooks
