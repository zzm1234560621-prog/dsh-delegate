# DSH already has native subagents (subagent / subagent_fork / workflow), so this
# bundle does not mount an MCP client inside DSH.
#
# It only wires *external* agent clients (Claude Desktop / Claude Code / Codex) to
# the local DSH MCP server, so installing this bundle in DSH is enough for Claude
# to call DSH. Set wireClients: false to opt out.
- insert:
    - id: dsh-delegate-bootstrap
      name: dsh-delegate
      config:
        wireClients: true
